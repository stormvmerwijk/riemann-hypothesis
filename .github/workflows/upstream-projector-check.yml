name: Verify upstream projector

on:
  push:
    branches: [validate-upstream-projector-2952]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the validation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - name: Free runner space for the proof cache
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Fetch the exact base and proposed proof
        run: |
          git fetch --no-tags --depth=1 origin 251c7b05dd869ceba1aa42c6001c00b4010f23f9 0261918b689f8a6cc647c8726d04fbf4f0708a52
          git checkout --detach 251c7b05dd869ceba1aa42c6001c00b4010f23f9

      - name: Install the pinned Lean toolchain
        run: |
          test "$(tr -d '\r\n' < lean-toolchain)" = 'leanprover/lean4:v4.37.0-rc1'
          curl -fsSL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.37.0-rc1

      - name: Restore the validated baseline cache
        run: |
          lake exe cache get
          lake build --no-build

      - name: Build the proposed proof and all dependent modules
        run: |
          git checkout --detach 0261918b689f8a6cc647c8726d04fbf4f0708a52
          lake build

      - name: Check strict warnings and replay the changed module
        run: |
          lake env lean -j2 --tstack=400000 -DautoImplicit=false -DrelaxedAutoImplicit=false -DmaxSynthPendingDepth=3 -Dpp.unicode.fun=true -DmaxHeartbeats=4000000 -DwarningAsError=true src/Development/AbelianVarietyTheory/Proofs/DecoratedLatticeProofs/IsolateAbstract.lean
          lake env leanchecker --verbose Development.AbelianVarietyTheory.Proofs.DecoratedLatticeProofs.IsolateAbstract
          printf 'import Development.AbelianVarietyTheory.Proofs.DecoratedLatticeProofs.IsolateAbstract\n#print axioms GlobalTheory.isolate_abstract\n' | lake env lean --stdin
